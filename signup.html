<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf9f8;
            color: #1b1c1c;
            -webkit-font-smoothing: antialiased;
        }
        .auth-card-shadow {
            box-shadow: 0 4px 24px rgba(94, 113, 83, 0.10);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md">
<header class="w-full top-0 sticky z-50 bg-background dark:bg-background">
<div class="max-w-container-max mx-auto px-margin-desktop h-20 flex justify-between items-center">
<a class="font-headline-md text-headline-md font-medium text-primary dark:text-primary-fixed" href="index.html">Organic Harvest</a>
<a class="text-secondary hover:text-primary transition-colors font-label-md text-label-md" href="index.html">Back to Shop</a>
</div>
</header>

<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl">
<div class="w-full max-w-md">
<div class="auth-card-shadow bg-surface-container-lowest rounded-lg p-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs text-center">Join the Harvest</h1>
<p class="text-secondary text-center mb-lg">Create an account for fresher deliveries.</p>

<div class="hidden mb-md p-3 rounded bg-error-container text-on-error-container text-label-sm" id="error-banner"></div>

<form class="space-y-md" id="signup-form">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1" for="name">Full Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" id="name" placeholder="Jane Doe" required="" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1" for="email">Email</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" id="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1" for="password">Password</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" id="password" minlength="6" placeholder="At least 6 characters" required="" type="password"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1" for="confirm-password">Confirm Password</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-colors" id="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<label class="flex items-start gap-2 text-secondary text-label-sm">
<input class="mt-1 rounded border-outline-variant text-primary focus:ring-primary" required="" type="checkbox"/>
                    I agree to the Terms of Service and Privacy Policy
                </label>
<button class="w-full bg-primary text-on-primary py-3 rounded-full font-label-md text-label-md hover:opacity-90 transition-opacity active:scale-[0.98] duration-150" type="submit">
                    CREATE ACCOUNT
                </button>
</form>

<p class="text-center text-secondary mt-lg">
                Already have an account?
                <a class="text-primary font-medium hover:underline" href="login.html">Log in</a>
</p>
</div>
</div>
</main>

<footer class="w-full bg-secondary-container dark:bg-secondary-fixed">
<div class="max-w-container-max mx-auto px-margin-desktop py-md text-center">
<p class="font-body-md text-body-md text-on-secondary-container">© 2024 Organic Harvest. Grown with intention.</p>
</div>
</footer>

<script>
    document.getElementById('signup-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        const banner = document.getElementById('error-banner');

        if (password !== confirm) {
            banner.textContent = 'Passwords do not match.';
            banner.classList.remove('hidden');
            return;
        }
        if (password.length < 6) {
            banner.textContent = 'Password must be at least 6 characters.';
            banner.classList.remove('hidden');
            return;
        }

        sessionStorage.setItem('oh_user', JSON.stringify({ name, email, role: 'customer' }));
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
